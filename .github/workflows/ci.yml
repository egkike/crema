name: Crema CI

on:
  push:
    branches: [ master ]
    paths:
      - 'backend/**'
      - 'shared/**'
      - 'frontend-admin/**'
      - '.github/workflows/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
  pull_request:
    branches: [ master ]
    paths:
      - 'backend/**'
      - 'shared/**'
      - 'frontend-admin/**'
      - '.github/workflows/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'

jobs:
  # =========================================================================
  # Backend QA
  # =========================================================================
  backend-qa:
    runs-on: ubuntu-latest
    
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    
    defaults:
      run:
        working-directory: backend

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup pnpm
      uses: pnpm/action-setup@v4
      with:
        version: 10

    - name: Setup Node.js
      uses: actions/setup-node@v5
      with:
        node-version: 22
        cache: 'pnpm'
        cache-dependency-path: pnpm-lock.yaml

    - name: Install dependencies
      run: |
        echo "=== Install start ==="
        pnpm install --frozen-lockfile
        echo "=== Install done ==="
        pnpm list --depth=0 || true

    - name: TypeScript check
      run: |
        echo "=== TS check start ==="
        pnpm tsc --noEmit
        echo "=== TS check done ==="

    - name: Lint code
      run: pnpm lint

    - name: Run tests
      run: pnpm test
      env:
        NODE_ENV: test
        SECRET_JWT_KEY: 'test-secret-super-largo-para-tests'
        SECRET_REFRESH_JWT_KEY: 'test-secret-refresh-super-largo-para-tests'
        PASSWORD_PEPPER: 'test-pepper'

    - name: Build project
      run: pnpm build

  # =========================================================================
  # Frontend Admin QA
  # =========================================================================
  frontend-admin-qa:
    runs-on: ubuntu-latest
    
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup pnpm
      uses: pnpm/action-setup@v4
      with:
        version: 10

    - name: Setup Node.js
      uses: actions/setup-node@v5
      with:
        node-version: 22
        cache: 'pnpm'
        cache-dependency-path: pnpm-lock.yaml

    - name: Install dependencies
      run: |
        echo "=== Install start ==="
        pnpm install --frozen-lockfile
        echo "=== Install done ==="
        pnpm list --depth=0 || true

    - name: TypeScript check
      run: |
        echo "=== TS check start ==="
        pnpm --filter frontend-admin run check
        echo "=== TS check done ==="

    - name: Lint code
      run: pnpm --filter frontend-admin lint

    - name: Build project
      run: pnpm --filter frontend-admin build
