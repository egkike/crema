name: Crema CI

on:
  push:
    branches: [ master ]
    paths:
      - 'backend/**'
      - 'shared/**'
      - 'frontend-admin/**'
      - '.github/workflows/**'
  pull_request:
    branches: [ master ]
    paths:
      - 'backend/**'
      - 'shared/**'
      - 'frontend-admin/**'
      - '.github/workflows/**'

jobs:
  # =========================================================================
  # Backend QA
  # =========================================================================
  backend-qa:
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: backend

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup pnpm
      uses: pnpm/action-setup@v4
      with:
        version: 10

    - name: Setup Node.js
      uses: actions/setup-node@v5
      with:
        node-version: 22
        cache: 'pnpm'
        cache-dependency-path: backend/pnpm-lock.yaml

    - name: Install dependencies
      run: pnpm install

    - name: TypeScript check
      run: pnpm tsc --noEmit

    - name: Lint code
      run: pnpm lint

    - name: Run tests
      run: pnpm test
      env:
        NODE_ENV: test
        FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
        SECRET_JWT_KEY: 'test-secret-super-largo-para-tests'
        SECRET_REFRESH_JWT_KEY: 'test-secret-refresh-super-largo-para-tests'
        PASSWORD_PEPPER: 'test-pepper'

    - name: Build project
      run: pnpm build

  # =========================================================================
  # Frontend Admin QA
  # =========================================================================
  frontend-admin-qa:
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: frontend-admin

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup pnpm
      uses: pnpm/action-setup@v4
      with:
        version: 10

    - name: Setup Node.js
      uses: actions/setup-node@v5
      with:
        node-version: 22
        cache: 'pnpm'
        cache-dependency-path: frontend-admin/pnpm-lock.yaml

    - name: Install dependencies
      run: pnpm install

    - name: TypeScript check
      run: pnpm tsc --noEmit

    - name: Lint code
      run: pnpm lint

    - name: Build project
      run: pnpm build
