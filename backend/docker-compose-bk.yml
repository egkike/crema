version: '3.9'

services:
  api:
    build:
      context: ..
      dockerfile: backend/Dockerfile
      network: host 
    container_name: crema-api
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./logs:/app/logs        # Persistencia de los logs
      - ./uploads:/app/uploads  # Persistencia del contenido de los Creadores
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - crema-net
    ports:
      # Exponemos explícitamente a 0.0.0.0 para que el "host" pueda verlo
      - "0.0.0.0:3000:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health', r => process.exit(r.statusCode === 200 ? 0 : 1))"]
      interval: 30s
      timeout: 10s
      retries: 3

  db:
    image: pgvector/pgvector:pg16-trixie
    container_name: crema-db
    restart: always
    env_file: .env
    environment:
      # Forzamos a que use la ruta estándar de Docker
      - PGDATA=/var/lib/postgresql/data/pgdata
    ports:
      # Mapeo de puerto PostgreSQL al host
      - "5432:5432"
    volumes:
      # Mapeamos nuestra carpeta local a esa misma ruta interna
      - ./postgres-data:/var/lib/postgresql/data/pgdata   # Persistencia de la base de datos
      - ./db/init:/docker-entrypoint-initdb.d             # Scripts automáticos (solo primera vez)
    networks:
      - crema-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${DB_USER} -d $${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: crema-redis
    restart: always
    networks:
      - crema-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s

  ngrok:
    image: ngrok/ngrok:latest
    container_name: crema-ngrok
    restart: always
    network_mode: host
    environment:
      - NGROK_AUTHTOKEN=${NGROK_AUTHTOKEN}
    command: http localhost:3000 --url=https://${NGROK_DOMAIN}
    depends_on:
      api:
        condition: service_healthy

networks:
  crema-net:
    driver: bridge