version: '3.9'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
      network: host
    container_name: crema-api
    network_mode: "host"
    dns:
      - 8.8.8.8
      - 8.8.4.4
      - 1.1.1.1
      - 1.0.0.1
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy  
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "node -e \"const http = require('http'); http.get('http://localhost:3000/health', (r) => { r.statusCode === 200 ? process.exit(0) : process.exit(1); }).on('error', () => process.exit(1));\""]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 120s  # Tiempo generoso para arranque lento (recomendado)

  db:
    image: postgres:18
    container_name: crema-db
    restart: always
    env_file:
      - .env
    ports:
      - "5432:5432" # Mapeo necesario para que la API en modo 'host' lo vea en localhost  
    volumes:
      - ./postgres-data:/var/lib/postgresql       # Persistencia de datos
      - ./db/init:/docker-entrypoint-initdb.d     # Scripts automáticos (solo primera vez)
    dns:
      - 8.8.8.8
      - 8.8.4.4
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - app-network

  redis:
    image: redis:7-alpine # Versión ligera y estable
    container_name: crema-redis
    restart: always
    ports:
      - "6379:6379" # Mapeo necesario para BullMQ vía localhost
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@local.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"  # Accede en http://localhost:5050 (solo dev)
    dns:
      - 8.8.8.8
      - 8.8.4.4
    depends_on:
      - db

networks:
  app-network:
    driver: bridge
